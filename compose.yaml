# 单文件 SQLite 部署：没有数据库容器，一个卷同时保存数据库与证据文件。
name: papergrade

x-app-env: &app-env
  SERVER_ADDR: ":8080"
  SQLITE_PATH: /app/data/papergrade.db
  DATA_DIR: /app/data
  APP_ENCRYPTION_KEY: ${APP_ENCRYPTION_KEY:?Set a stable APP_ENCRYPTION_KEY (openssl rand -hex 32)}
  ADMIN_USERNAME: ${ADMIN_USERNAME:-teacher}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:?Set ADMIN_PASSWORD in .env}
  DEV_MODE: "false"
  PUBLIC_ORIGIN: "https://${DOMAIN:?Set DOMAIN}"
  GOMAXPROCS: "1"

x-log: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ${IMAGE:-papergrade:local}
    build: {context: ., target: app}
    command: ["api"]
    environment:
      <<: *app-env
      GOMEMLIMIT: 96MiB
    volumes: ["evidence:/app/data"]
    tmpfs: ["/tmp:size=32m,mode=1777"]
    mem_limit: 160m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "papergrade", "healthcheck"]
      interval: 20s
      timeout: 4s
      start_period: 15s
      retries: 3
    logging: *logging
    networks: [edge]

  worker:
    image: ${IMAGE:-papergrade:local}
    build: {context: ., target: app}
    command: ["worker"]
    environment:
      <<: *app-env
      GOMEMLIMIT: 128MiB
    volumes: ["evidence:/app/data"]
    tmpfs: ["/tmp:size=64m,mode=1777"]
    mem_limit: 192m
    cpus: "0.50"
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on: [api]
    logging: *logging
    networks: [edge]

  gateway:
    image: ${IMAGE:-papergrade:local}-gateway
    build: {context: ., target: gateway}
    environment:
      DOMAIN: ${DOMAIN:?Set DOMAIN to your HTTPS domain}
    ports: ["80:80", "443:443", "443:443/udp"]
    volumes: ["caddydata:/data", "caddyconfig:/config"]
    mem_limit: 64m
    restart: unless-stopped
    depends_on: [api]
    logging: *logging
    networks: [edge]

volumes:
  evidence:
  caddydata:
  caddyconfig:

networks:
  edge:
