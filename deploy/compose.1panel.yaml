# Papergrade 阅卷系统 · 1Panel 编排（SQLite 单文件，无数据库服务）
# 粘贴到 1Panel「容器 -> 编排 -> 创建编排」。
# 只需替换 4 处：加密主密钥、管理员密码、访问域名。
# 生成随机值：openssl rand -hex 32
name: papergrade

x-app-env: &app-env
  SERVER_ADDR: ":8080"
  SQLITE_PATH: /app/data/papergrade.db
  DATA_DIR: /app/data
  APP_ENCRYPTION_KEY: "CHANGE_ME_ENCRYPTION_KEY"
  ADMIN_USERNAME: "teacher"
  ADMIN_PASSWORD: "CHANGE_ME_ADMIN_PASSWORD"
  DEV_MODE: "false"
  # 浏览器实际访问的 https 地址，结尾不要带斜杠
  PUBLIC_ORIGIN: "https://exam.example.com"
  GOMAXPROCS: "1"

x-log: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  api:
    image: ghcr.io/alumos/papergrade:0.2.2
    container_name: papergrade-api
    command: ["api"]
    environment:
      <<: *app-env
      GOMEMLIMIT: 96MiB
    volumes:
      - evidence:/app/data
    tmpfs:
      - /tmp:size=32m,mode=1777
    mem_limit: 192m
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 25s
    healthcheck:
      test: ["CMD", "papergrade", "healthcheck"]
      interval: 20s
      timeout: 4s
      start_period: 20s
      retries: 3
    logging: *logging
    networks: [edge]

  worker:
    image: ghcr.io/alumos/papergrade:0.2.2
    container_name: papergrade-worker
    command: ["worker"]
    environment:
      <<: *app-env
      GOMEMLIMIT: 128MiB
    volumes:
      - evidence:/app/data
    tmpfs:
      - /tmp:size=64m,mode=1777
    mem_limit: 256m
    cpus: "0.50"
    pids_limit: 128
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: unless-stopped
    stop_grace_period: 30s
    depends_on: [api]
    logging: *logging
    networks: [edge]

  # 容器内 8090 纯 HTTP；HTTPS 由 1Panel 网站反向代理负责
  gateway:
    image: ghcr.io/alumos/papergrade:0.2.2-gateway
    container_name: papergrade-gateway
    environment:
      DOMAIN: ":8090"
    ports:
      - "127.0.0.1:18080:8090"
    mem_limit: 96m
    restart: unless-stopped
    depends_on: [api]
    logging: *logging
    networks: [edge]

volumes:
  evidence:

networks:
  edge:
